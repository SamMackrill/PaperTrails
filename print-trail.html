<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper Trails · printable research trail</title>
  <link rel="icon" href="images/icon.png">
  <style>
    :root { color-scheme: only light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3ede1; color: #2a241c; font: 15px/1.6 Georgia, serif; }
    .print-controls { display: flex; justify-content: space-between; gap: 20px; padding: 20px max(20px, calc((100vw - 900px) / 2)); border-bottom: 1px solid #ddd2bf; font: 13px system-ui, sans-serif; }
    button { padding: 8px 18px; cursor: pointer; background: #2f4a7a; border: 0; color: white; border-radius: 4px; }
    button:disabled { opacity: .4; }
    a { color: #2f4a7a; text-underline-offset: 3px; overflow-wrap: anywhere; }
    main { max-width: 900px; margin: 40px auto; padding: 0 24px; }
    header { border-bottom: 2px solid #3d6862; padding-bottom: 25px; margin-bottom: 30px; }
    .kicker, .stop-index { font: 700 11px/1.6 system-ui, sans-serif; letter-spacing: .1em; color: #3d6862; }
    h1 { font-size: 42px; font-weight: 500; margin: 10px 0; }
    h2 { font-size: 23px; line-height: 1.25; margin: 8px 0 20px; }
    h3 { font-size: 19px; margin: 10px 0; }
    h4 { font: 700 11px system-ui, sans-serif; text-transform: uppercase; color: #3d6862; margin: 22px 0 8px; }
    .scope { font-size: 13px; color: #5c5245; }
    article { padding: 24px 0; border-bottom: 1px dashed #c9bba2; }
    .trail-date-note { background: #dde8e4; padding: 10px 14px; border-left: 2px solid #3d6862; font-size: 13px; }
    .trail-evidence { margin: 25px 0; }
    .trail-evidence summary { display: none; }
    .trail-sources { padding-left: 20px; font: 12px/1.6 system-ui, sans-serif; }
    .trail-sources li { margin-bottom: 14px; }
    .source-locator { margin: 4px 0; color: #5c5245; }
    .return-to-timeline { font: 12px system-ui, sans-serif; }
    footer { font-size: 12px; padding: 30px 0; }
    @page { size: A4; margin: 18mm; }
    @media print {
      body { background: white; color: #111; font-size: 10pt; }
      .print-controls, .return-to-timeline { display: none; }
      main { margin: 0; padding: 0; max-width: none; }
      h1 { font-size: 27pt; }
      h2 { font-size: 16pt; }
      h3 { font-size: 13pt; }
      h2, h3, h4, .stop-index { break-after: avoid; }
      p, li { orphans: 3; widows: 3; }
      .trail-sources { font-size: 8pt; }
      .trail-sources a::after { content: ' — ' attr(href); font-weight: normal; color: #333; overflow-wrap: anywhere; }
      .trail-date-note { print-color-adjust: exact; }
      article { break-before: page; border-bottom: 0; }
      header { break-after: avoid; }
      article:first-of-type { break-before: auto; }
    }
  </style>
</head>
<body>
  <nav class="print-controls" aria-label="Print controls"><a href="./">← Paper Trails timeline</a><button id="print" type="button" disabled>Print / save PDF</button></nav>
  <main id="print-content" aria-busy="true"><p role="status">Preparing the sourced trail…</p></main>
  <script src="vendor/js-yaml.min.js"></script>
  <script type="module" src="src/printTrail.js?v=pass2-labels-v5"></script>
</body>
</html>
