- year: 1897
  title: "Discovery of the Electron"
  discoverer: "J. J. Thomson"
  scientist_ids: [thomson]
  details: "Identified the electron as a subatomic particle..."
  particle: e⁻
  color: "#0000FF" # Blue

- year: 1932
  title: "Discovery of the Positron"
  discoverer: "Carl Anderson"
  scientist_ids: [anderson]
  details: "Observed the positron (antielectron) in cosmic ray tracks..."
  particle: e⁺
  color: "#FF0000" # Red

- year: 1932
  title: "Discovery of the Neutron"
  discoverer: "James Chadwick"
  scientist_ids: [chadwick]
  details: "Identified the neutron as a neutral subatomic particle in the atomic nucleus."
  particle: N
  color: "#008000" # Green

- year: 1919
  title: "Discovery of the Proton"
  discoverer: "Ernest Rutherford"
  scientist_ids: [rutherford]
  details: "Ernest Rutherford discovered the proton through experiments involving alpha particles and nitrogen gas."
  particle: p⁺
  color: "#FF0000" # Red

- title: "Michelson-Morley Experiment"
  year: 1887
  discoverer: "Albert A. Michelson and Edward W. Morley"
  scientist_ids: [michelson, morley]
  particle: MM
  color: "#1abc9c"
  details: "Found no significant ether wind, a landmark null result that challenged luminiferous-aether theories and helped prepare the way for special relativity."

- year: 1676
  title: "First Measurement of the Speed of Light"
  discoverer: "Ole Rømer"
  scientist_ids: [roemer]
  details: "Ole Rømer measured the speed of light by observing the eclipses of Jupiter's moons."
  particle: c
  color: "#ffcc00" # Golden Yellow

- year: 1745
  title: "Invention of the Leyden Jar"
  discoverer: "Ewald Georg von Kleist"
  scientist_ids: [kleist]
  details: "Ewald Georg von Kleist invented the Leyden jar, the first capacitor, capable of storing electrical charge."
  particle: LJar
  color: "#8b0000" # Dark Red

- year: 1848
  title: "Concept of Absolute Zero"
  discoverer: "Lord Kelvin"
  scientist_ids: [kelvin]
  details: "Lord Kelvin introduced the concept of absolute zero, the theoretical temperature at which all molecular motion ceases."
  particle: 0K
  color: "#4682B4" # Steel Blue

- year: 1831
  title: "Discovery of Electromagnetic Induction"
  discoverer: "Michael Faraday"
  scientist_ids: [faraday]
  details: "Michael Faraday discovered electromagnetic induction, the principle behind electric generators and transformers."
  particle: EMI
  color: "#e76f51" # Coral Red

- title: "Casimir Effect Verification"
  year: 1997
  discoverer: "Steve K. Lamoreaux and others"
  scientist_ids: [lamoreaux]
  particle: ZPE
  color: "#9b59b6"
  details: "Experimental verification of the Casimir effect, demonstrating the existence of quantum vacuum fluctuations."

- title: "Solar Eclipse"
  year: 1919
  discoverer: "Arthur Stanley Eddington"
  scientist_ids: [eddington]
  particle: 🌓︎
  details: "Observed solar eclipse showing light slows near heavy bodies."
  color: "#c0c0c0"

- year: 1964
  title: "Discovery of Cosmic Microwave Background"
  discoverer: "Arno Penzias and Robert Wilson"
  scientist_ids: [penzias, wilson_robert]
  details: "Accidentally detected the CMB radiation."
  particle: CMB
  color: "#add8e6" # Light Blue

- year: 2021
  title: "Breit-Wheeler photon-photon matter creation Verification"
  discoverer: "RHIC"
  details: "Experimental verification of the Breit-Wheeler process, converting light into matter."
  particle: γγ
  color: "#2ecc71" # Emerald green

- year: 1881
  title: "First International Electrical Congress"
  type: conference
  attendee_ids: [hippolyte_fizeau, gustav_kirchhoff, mach, kelvin]
  details: "Held in Paris alongside the International Exposition of Electricity, the congress helped establish an internationally consistent system of practical electrical units, including the ohm, volt, ampere, coulomb, and farad."
  particle: Ω
  color: "#8A2BE2" # BlueViolet

- year: 1911
  title: "First Solvay Conference"
  type: conference
  attendee_ids: [einstein, lorentz, nernst, planck, poincare, rutherford]
  details: "The first Solvay Conference, devoted to radiation and the quanta, brought leading physicists together to confront the conflict between classical physics and the emerging quantum ideas of Planck and Einstein."
  particle: Ⅰ
  color: "#8A2BE2" # BlueViolet

- year: 1927
  title: "Fifth Solvay International Conference"
  type: conference
  attendee_ids: [bohr, compton, deBroglie, dirac, einstein, heisenberg, lorentz, pauli, planck, schrodinger]
  details: "The fifth Solvay International Conference on Electrons and Photons, where many of the world's most notable physicists met to discuss the newly formulated quantum theory. Key discussions on wave-particle duality and the uncertainty principle took place."
  particle: ⑤
  color: "#8A2BE2" # BlueViolet

- year: 1933
  title: "Seventh Solvay Conference"
  type: conference
  attendee_ids: [bohr, chadwick, deBroglie, dirac, heisenberg, pauli, rutherford, schrodinger]
  details: "Devoted to the structure and properties of atomic nuclei, the seventh Solvay Conference brought together the rapidly developing evidence for neutrons, positrons, nuclear transformations, and new models of the nucleus."
  particle: Ⅶ
  color: "#8A2BE2" # BlueViolet

- year: 1947
  title: "Shelter Island Conference"
  type: conference
  attendee_ids: [feynman, lamb]
  details: "A pivotal post-war meeting on quantum electrodynamics where Willis Lamb reported the Lamb shift. The discussions helped spur the calculations and renormalization methods that made modern QED a consistent predictive theory."
  particle: QED
  color: "#8A2BE2" # BlueViolet

- year: 1957
  title: "Chapel Hill Conference on Gravitation"
  type: conference
  attendee_ids: [dicke, feynman, sciama]
  details: "The conference examined experimental tests of general relativity, gravitational radiation, cosmology, and the quantization of gravity. Feynman's arguments there helped clarify that gravitational waves carry physically measurable energy."
  particle: GR
  color: "#8A2BE2" # BlueViolet
