- id: discovery-00
  legacyKey: discovery:0
  year: 1455
  title: "Gutenberg Bible and European Movable-Type Printing"
  discoverer: "Johannes Gutenberg and collaborators"
  details: "The Gutenberg Bible became the first major Western book printed from movable metal type, demonstrating a reproducible process that greatly accelerated the circulation of texts."
  particle: Aa
  color: "#7f5539"

- id: discovery-01
  legacyKey: discovery:1
  year: 1522
  title: "First Circumnavigation of Earth"
  discoverer: "Magellan–Elcano expedition"
  details: "The Victoria returned to Spain after completing the first recorded circumnavigation, confirming in practice that the oceans were connected and supplying new evidence for the globe's scale."
  particle: "⟳"
  color: "#2a9d8f"

- id: discovery-02
  legacyKey: discovery:2
  year: 1569
  title: "Mercator World Map Projection"
  discoverer: "Gerardus Mercator"
  details: "Mercator's world map introduced a projection on which constant-bearing routes appear as straight lines, making it influential for marine navigation while strongly enlarging high latitudes."
  particle: MAP
  color: "#457b9d"

- id: discovery-03
  legacyKey: discovery:3
  year: 1572
  title: "Tycho's Supernova"
  discoverer: "Tycho Brahe and other observers"
  scientist_ids: [tycho_brahe]
  details: "Brahe's measurements placed the 'new star' beyond the Moon, challenging the Aristotelian doctrine of an unchanging celestial realm; it is now known as SN 1572."
  particle: SN
  color: "#b07d2b"

- id: discovery-04
  legacyKey: discovery:4
  year: 1582
  title: "Gregorian Calendar Reform"
  discoverer: "Aloysius Lilius, Christopher Clavius, and Pope Gregory XIII"
  scientist_ids: [clavius]
  details: "The reform removed ten calendar days and revised leap-year rules to keep the civil year more closely aligned with the seasons; adoption spread gradually beyond the first Catholic states."
  particle: CAL
  color: "#6d597a"

- id: discovery-05
  legacyKey: discovery:5
  year: 1897
  title: "Discovery of the Electron"
  discoverer: "J. J. Thomson"
  scientist_ids: [thomson]
  details: "Identified the electron as a subatomic particle..."
  particle: e⁻
  color: "#0000FF" # Blue

- id: discovery-06
  legacyKey: discovery:6
  year: 1932
  title: "Discovery of the Positron"
  discoverer: "Carl Anderson"
  scientist_ids: [anderson]
  details: "Observed the positron (antielectron) in cosmic ray tracks..."
  particle: e⁺
  color: "#FF0000" # Red

- id: discovery-07
  legacyKey: discovery:7
  year: 1932
  title: "Discovery of the Neutron"
  discoverer: "James Chadwick"
  scientist_ids: [chadwick]
  details: "Identified the neutron as a neutral subatomic particle in the atomic nucleus."
  particle: N
  color: "#008000" # Green

- id: discovery-08
  legacyKey: discovery:8
  year: 1919
  title: "Discovery of the Proton"
  discoverer: "Ernest Rutherford"
  scientist_ids: [rutherford]
  details: "Ernest Rutherford discovered the proton through experiments involving alpha particles and nitrogen gas."
  particle: p⁺
  color: "#FF0000" # Red

- id: discovery-09
  legacyKey: discovery:9
  title: "Michelson-Morley Experiment"
  year: 1887
  discoverer: "Albert A. Michelson and Edward W. Morley"
  scientist_ids: [michelson, morley]
  particle: MM
  color: "#1abc9c"
  details: "Found no significant ether wind, a landmark null result that challenged luminiferous-aether theories and helped prepare the way for special relativity."

- id: discovery-10
  legacyKey: discovery:10
  year: 1676
  title: "First Measurement of the Speed of Light"
  discoverer: "Ole Rømer"
  scientist_ids: [roemer]
  details: "Ole Rømer measured the speed of light by observing the eclipses of Jupiter's moons."
  particle: c
  color: "#ffcc00" # Golden Yellow

- id: discovery-11
  legacyKey: discovery:11
  year: 1708
  title: "Measurement of the Speed of Sound"
  discoverer: "William Derham"
  scientist_ids: [derham]
  details: "Derham timed the delay between the visible flash and the report of distant gunfire from the tower of St Laurence Church in Upminster. Using surveyed distances, he obtained one of the earliest reasonably accurate measurements of the speed of sound in air."
  particle: vₛ
  color: "#52796f"

- id: discovery-12
  legacyKey: discovery:12
  year: 1745
  title: "Invention of the Leyden Jar"
  discoverer: "Ewald Georg von Kleist"
  scientist_ids: [kleist]
  details: "Ewald Georg von Kleist invented the Leyden jar, the first capacitor, capable of storing electrical charge."
  particle: LJar
  color: "#8b0000" # Dark Red

- id: discovery-13
  legacyKey: discovery:13
  year: 1758
  title: "Return of Halley's Comet"
  discoverer: "Johann Georg Palitzsch; return predicted by Edmond Halley"
  theorist_ids: [newton, halley]
  details: "Palitzsch recovered the predicted comet on 25 December 1758; it reached perihelion in March 1759. Its return confirmed Halley's application of Newtonian gravitation to periodic cometary orbits."
  sources:
    - label: "NASA: Halley’s Comet (historical report)"
      url: "https://ntrs.nasa.gov/api/citations/19800003728/downloads/19800003728.pdf"
      locator: "Palitzsch’s recovery on 25 December 1758 and the March 1759 perihelion."
    - label: "ESA: Giotto approaching Comet Halley"
      url: "https://www.esa.int/ESA_Multimedia/Images/2016/03/Giotto_approaching_Comet_Halley"
      locator: "Halley died before the predicted return; confirmation came with the 1758–59 apparition."
  particle: "☄"
  color: "#6f4e7c"

- id: discovery-14
  legacyKey: discovery:14
  year: 1848
  title: "Concept of Absolute Zero"
  discoverer: "Lord Kelvin"
  scientist_ids: [kelvin]
  details: "Lord Kelvin introduced the concept of absolute zero, the theoretical temperature at which all molecular motion ceases."
  particle: 0K
  color: "#4682B4" # Steel Blue

- id: discovery-15
  legacyKey: discovery:15
  year: 1831
  title: "Discovery of Electromagnetic Induction"
  discoverer: "Michael Faraday"
  scientist_ids: [faraday]
  details: "Michael Faraday discovered electromagnetic induction, the principle behind electric generators and transformers."
  particle: EMI
  color: "#e76f51" # Coral Red

- id: discovery-16
  legacyKey: discovery:16
  title: "Casimir Effect Verification"
  year: 1997
  discoverer: "Steve K. Lamoreaux and others"
  scientist_ids: [lamoreaux]
  theorist_ids: [casimir]
  particle: ZPE
  color: "#9b59b6"
  details: "Experimental verification of the Casimir effect, demonstrating the existence of quantum vacuum fluctuations."

- id: discovery-17
  legacyKey: discovery:17
  title: "Solar Eclipse"
  year: 1919
  discoverer: "Arthur Stanley Eddington"
  scientist_ids: [eddington]
  particle: 🌓︎
  details: "Observed solar eclipse showing light slows near heavy bodies."
  color: "#c0c0c0"

- id: discovery-18
  legacyKey: discovery:18
  year: 1964
  title: "Discovery of Cosmic Microwave Background"
  discoverer: "Arno Penzias and Robert Wilson"
  scientist_ids: [penzias, wilson_robert]
  details: "Accidentally detected the CMB radiation."
  particle: CMB
  color: "#add8e6" # Light Blue

- id: discovery-19
  legacyKey: discovery:19
  year: 2021
  title: "Breit-Wheeler photon-photon matter creation Verification"
  discoverer: "RHIC"
  theorist_ids: [breit, wheeler]
  details: "Experimental verification of the Breit-Wheeler process, converting light into matter."
  particle: γγ
  color: "#2ecc71" # Emerald green

- id: discovery-20
  legacyKey: discovery:20
  year: 1672
  title: "Measuring the Scale of Earth's Orbit"
  discoverer: "Giovanni Domenico Cassini and Jean Richer"
  scientist_ids: [cassini, richer]
  details: "Comparing observations of Mars from Paris and Cayenne during its 1672 opposition gave a parallax estimate of its distance. Combined with the relative planetary distances from Kepler's laws, this established a much improved Earth–Sun distance and hence the diameter of Earth's orbit, approximately twice that distance."
  particle: AU
  color: "#98603f"

- id: discovery-21
  legacyKey: discovery:21
  year: 1728
  title: "Stellar Aberration"
  discoverer: "James Bradley, using observations begun with Samuel Molyneux"
  scientist_ids: [bradley, molyneux]
  details: "Using observations begun with Samuel Molyneux, Bradley explained an annual change in apparent star positions by combining Earth's orbital velocity with the finite speed of light. Stellar aberration supplied evidence for Earth's orbital motion and a new way to estimate light's speed."
  particle: "α"
  color: "#51768c"

- id: discovery-22
  legacyKey: discovery:22
  year: 1800
  title: "Discovery of Infrared Radiation"
  discoverer: "William Herschel"
  scientist_ids: [herschel]
  details: "Thermometers placed beyond the red end of a dispersed solar spectrum recorded heating from invisible radiation. Herschel's experiments extended the known spectrum beyond visible light."
  particle: IR
  color: "#ab7040"

- id: discovery-23
  legacyKey: discovery:23
  year: 1820
  title: "Electric Current Deflects a Compass"
  discoverer: "Hans Christian Ørsted"
  scientist_ids: [oersted]
  details: "Ørsted observed a compass needle deflect beside a wire carrying electric current, demonstrating a connection between electricity and magnetism and prompting the development of electrodynamics."
  particle: EM
  color: "#3d8a83"

- id: discovery-24
  legacyKey: discovery:24
  year: 1845
  title: "Faraday Rotation"
  discoverer: "Michael Faraday"
  scientist_ids: [faraday]
  details: "Faraday rotated the plane of polarization of light passing through glass in a magnetic field. This magneto-optical effect provided direct experimental evidence linking light and magnetism."
  particle: "↻"
  color: "#e76f51"

- id: discovery-25
  legacyKey: discovery:25
  year: 1851
  title: "Fizeau's Moving-Water Experiment"
  discoverer: "Hippolyte Fizeau"
  scientist_ids: [hippolyte_fizeau]
  details: "An interference experiment measured how flowing water changes light propagation. Its result agreed with Fresnel's partial aether-drag coefficient; special relativity later explained the effect through velocity addition without requiring a material luminiferous aether."
  particle: H₂O
  color: "#457b9d"

- id: discovery-26
  legacyKey: discovery:26
  year: 1869
  title: "Periodic Table of Elements"
  discoverer: "Dmitri Mendeleev and Julius Lothar Meyer"
  scientist_ids: [mendeleev, meyer]
  details: "Mendeleev and Meyer independently organized elements by atomic weight and recurring chemical properties. Mendeleev published his periodic system in 1869 and used its gaps to predict missing elements. Meyer had presented a partial classification in 1864; his expanded table and atomic-volume curve appeared in 1870, demonstrating periodic trends in physical properties."
  particle: "PTE"
  color: "#687b45"

- id: discovery-27
  legacyKey: discovery:27
  year: 1887
  title: "Generation and Detection of Electromagnetic Waves"
  discoverer: "Heinrich Hertz"
  scientist_ids: [hertz]
  theorist_ids: [maxwell]
  details: "In experiments of 1887–1888, Hertz generated and detected electromagnetic waves with spark apparatus and demonstrated wave properties including reflection and interference, confirming a central prediction of Maxwell's theory."
  particle: RF
  color: "#467d92"

- id: discovery-28
  legacyKey: discovery:28
  year: 1900
  title: "Planck's Energy Quanta"
  discoverer: "Max Planck"
  scientist_ids: [planck]
  details: "To derive the black-body radiation spectrum, Planck treated oscillator energy exchange in elements proportional to frequency, E = hν. This introduced the quantum of action at the foundation of quantum theory."
  particle: hν
  color: "#8764a1"

- id: discovery-29
  legacyKey: discovery:29
  year: 1905
  title: "Light Quanta and the Photoelectric Effect"
  discoverer: "Albert Einstein"
  scientist_ids: [einstein]
  details: "Einstein proposed localized light quanta with energy hν and used them to explain the photoelectric effect, including its dependence on light frequency. This was a theoretical explanation of an already observed effect."
  particle: "γ"
  color: "#b08b31"

- id: discovery-30
  legacyKey: discovery:30
  year: 1911
  title: "Planck's Zero-Point Energy Proposal"
  discoverer: "Max Planck"
  scientist_ids: [planck]
  details: "Planck's second quantum theory introduced residual oscillator energy of hν/2 at zero temperature. Later quantum mechanics established zero-point energy as a property of systems such as the harmonic oscillator."
  particle: "½hν"
  color: "#7f70a1"

- id: discovery-31
  legacyKey: discovery:31
  year: 1912
  title: "Cepheid Period–Luminosity Relationship"
  discoverer: "Henrietta Swan Leavitt"
  scientist_ids: [leavitt]
  details: "Leavitt established a relationship between pulsation periods and brightness for Cepheid variables in the Small Magellanic Cloud. Because the stars were at approximately the same distance, this relation made Cepheids usable as distance indicators once calibrated."
  particle: CEP
  color: "#99658c"

- id: discovery-32
  legacyKey: discovery:32
  year: 1922
  title: "Stern–Gerlach Experiment"
  discoverer: "Otto Stern and Walther Gerlach"
  scientist_ids: [stern, gerlach]
  details: "A beam of silver atoms split into discrete components in an inhomogeneous magnetic field. Initially interpreted as spatial quantization of atomic angular momentum, the result was later understood in terms of the unpaired electron's spin."
  particle: "↑↓"
  color: "#597b67"

- id: discovery-33
  legacyKey: discovery:33
  year: 1947
  title: "Measurement of the Lamb Shift"
  discoverer: "Willis Lamb and Robert Retherford"
  scientist_ids: [lamb]
  details: "Lamb and Retherford used microwave spectroscopy to reveal a separation between hydrogen energy levels that Dirac's basic theory predicted to coincide. The measurement became a crucial test of radiative corrections in quantum electrodynamics."
  particle: ΔE
  color: "#487db0"

- id: discovery-34
  legacyKey: discovery:34
  year: 1948
  title: "Prediction of the Casimir Effect"
  discoverer: "Hendrik Casimir"
  scientist_ids: [casimir]
  details: "Casimir predicted an attractive force between ideal parallel conducting plates from the change in electromagnetic zero-point energy imposed by their boundaries. The prediction connected quantum field fluctuations with a measurable mechanical force."
  particle: ZPE
  color: "#9b59b6"

- id: discovery-35
  legacyKey: discovery:35
  year: 1959
  title: "Prediction of the Aharonov–Bohm Effect"
  discoverer: "Yakir Aharonov and David Bohm"
  scientist_ids: [aharonov, bohm]
  details: "Aharonov and Bohm predicted a shift in quantum interference when charged particles encircle magnetic flux even though their paths lie in a region with no magnetic field. The effect exposed the significance of electromagnetic potentials in quantum theory."
  particle: AB
  color: "#637ead"

- id: discovery-36
  legacyKey: discovery:36
  year: 1982
  title: "Bell Test with Changing Analyzer Settings"
  discoverer: "Alain Aspect, Jean Dalibard, and Gérard Roger"
  scientist_ids: [aspect, dalibard]
  theorist_ids: [bell]
  details: "Measurements of entangled photons with rapidly changing analyzer settings violated a Bell inequality, supporting quantum predictions against local hidden-variable models. The experiment was a major advance, although it did not close every experimental loophole."
  particle: BELL
  color: "#a77a3d"

- id: discovery-37
  legacyKey: discovery:37
  year: 1803
  title: "Young's Interference and Double-Slit Experiment"
  discoverer: "Thomas Young"
  scientist_ids: [young]
  details: "Building on his interference principle of 1801, Young described an optical experiment in 1803 in which sunlight passing on either side of a narrow card produced bright and dark fringes. This precursor of the modern double-slit arrangement demonstrated the superposition of light waves; the account was published in 1804."
  particle: "Ⅱ"
  color: "#4b8d9a"

- id: discovery-38
  legacyKey: discovery:38
  year: 1925
  title: "Miller's Ether-Drift Claim"
  discoverer: "Dayton Clarence Miller"
  scientist_ids: [miller]
  details: "Miller reported a small non-null signal in Mount Wilson repetitions of the Michelson–Morley experiment and interpreted it as ether drift, challenging the earlier null result. A 1955 reanalysis attributed the apparent signal to statistical fluctuations and local temperature effects and found the data consistent with a null result; Miller's claim is not an established refutation of Michelson–Morley or special relativity."
  particle: ETH
  color: "#7d8750"

- id: millikan-oil-drops
  legacyKey: discovery:39
  year: 1913
  title: Measuring the elementary electrical charge
  discoverer: Robert A. Millikan
  scientist_ids: [millikan]
  details: Millikan’s oil-drop measurements found charges in integer multiples of a common unit and estimated
    that elementary charge. Charge now has a measured unit as well as a sign, force law and carrier. This
    is a historical measurement with experimental assumptions, not the modern exact SI value.
  particle: e
  color: '#74573a'
  dateNote: 1913 publication; the oil-drop programme began earlier.
  sources:
  - label: Millikan · Elementary Electrical Charge (1913)
    url: https://doi.org/10.1103/PhysRev.2.109
    locator: Physical Review 2 (1 August 1913), pp. 109–143; §1 and oil-drop charge measurements
  - label: Millikan · original paper facsimile, AIP
    url: https://history.aip.org/exhibits/gap/PDF/millikan.pdf
    locator: Original 1913 paper, p. 109 and tables of observed charge multiples; historical measurement,
      not today’s exact SI definition

- id: first-camera-photograph
  legacyKey: discovery:40
  year: 1827
  title: "First Surviving Camera Photograph"
  discoverer: "Joseph Nicéphore Niépce"
  details: "Niépce made View from the Window at Le Gras using a camera obscura and a pewter plate coated with light-sensitive bitumen. The Harry Ransom Center, which holds the plate, dates it to 1827; older accounts often give 1826. This marks the earliest surviving camera photograph, rather than the invention of the much older camera obscura."
  particle: "CAM"
  color: "#9b7852"
  sources:
    - label: "Harry Ransom Center: the Niépce heliograph"
      url: "https://www.hrc.utexas.edu/niepce-heliograph/"

- id: kodachrome-colour-film
  legacyKey: discovery:41
  year: 1935
  title: "Kodachrome Colour Film Introduced"
  discoverer: "Leopold Mannes and Leopold Godowsky Jr., with Kodak"
  details: "Kodak introduced the three-colour Kodachrome process in 1935, initially for 16 mm motion-picture film. Developed by Mannes and Godowsky, it became a commercially successful amateur colour film. Earlier colour processes existed, including glass plates and other film systems; this milestone identifies the Kodachrome launch rather than claiming it was the first colour photograph. Its 35 mm slides and 8 mm home-movie formats followed in 1936."
  particle: "RGB"
  color: "#a2697d"
  sources:
    - label: "Kodak: 1935 milestone"
      url: "https://www.kodak.com/en/company/page/milestones/"
    - label: "George Eastman Museum / FIAF Film Atlas: Kodachrome"
      url: "https://www.filmatlas.com/entry/544"
