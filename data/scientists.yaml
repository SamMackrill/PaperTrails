    - year: 1821
      title: "Neue Modification des Lichtes durch gegenseitige Einwirkung und Beugung der Strahlen"
      abstract: "Reported quantitative diffraction experiments with finely ruled gratings and related wavelength to diffraction angle."

hippolyte_fizeau:
