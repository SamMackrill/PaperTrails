    - institution: "University of Göttingen"
      association: "Professor"
      coat: "images/institutions/university-of-gottingen.svg"
  publications:
    - year: 1908
      title: "Die Grundgleichungen für die elektromagnetischen Vorgänge in bewegten Körpern"
      abstract: "Expressed the electrodynamics of moving bodies in a four-dimensional mathematical form."
    - year: 1909
      title: "Raum und Zeit"
      abstract: "Presented space and time as aspects of a single four-dimensional spacetime geometry."

karl_schwarzschild:
  name: "Karl Schwarzschild"
  summary: "Found the first exact solution of Einstein's field equations, defining the spacetime outside a spherical mass."
  color: "#343a40"
  photo: "images/schwarzschild_karl.jpg"
  cartoon: "images/cartoons/schwarzschild_karl.png"
  nationality: "German"
  birth: "1873-10-09"
  death: "1916-05-11"
  academic_affiliations:
    - institution: "University of Strasbourg"
      association: "Doctorate"
      coat: "images/institutions/university-of-strasbourg.svg"
    - institution: "University of Göttingen"
      association: "Professor and observatory director"
      coat: "images/institutions/university-of-gottingen.svg"
  publications:
    - year: 1916
      title: "Über das Gravitationsfeld eines Massenpunktes nach der Einsteinschen Theorie"
      abstract: "Derived the exact vacuum solution describing spacetime outside a static spherical mass."
    - year: 1916
      title: "Über das Gravitationsfeld einer Kugel aus inkompressibler Flüssigkeit"
      abstract: "Derived an interior solution for a sphere of uniform-density fluid in general relativity."

pierre_laplace:
  name: "Pierre-Simon Laplace"
  summary: "Systematized celestial mechanics and explored how gravitation shapes the long-term behavior of the Solar System."
  color: "#8c1c13"
  photo: "images/laplace_pierre.jpg"
  cartoon: "images/cartoons/laplace_pierre.png"
  nationality: "French"
  birth: "1749-03-23"
  death: "1827-03-05"
  academic_affiliations:
    - institution: "University of Caen Normandy"
      association: "Student"
      coat: "images/institutions/university-of-caen-normandy.svg"
    - institution: "École Normale Supérieure"
      association: "Professor"
      coat: "images/institutions/ecole-normale-superieure.png"
  publications:
    - year: 1796
      title: "Exposition du système du monde"
      abstract: "Presented a comprehensive account of astronomy and proposed a nebular hypothesis for the formation of the Solar System."
    - year: 1799
      title: "Traité de mécanique céleste, Volume I"
      abstract: "Began a five-volume mathematical synthesis of Newtonian gravitation and planetary dynamics."

john_poynting:
  name: "John Henry Poynting"
  summary: "Identified the directional flow of electromagnetic energy and the momentum carried by radiation."
  color: "#006d77"
  photo: "images/poynting_john.jpg"
  cartoon: "images/cartoons/poynting_john.png"
  nationality: "English"
  birth: "1852-09-09"
  death: "1914-03-30"
  academic_affiliations:
    - institution: "University of Manchester"
      association: "Student and lecturer at Owens College"
      coat: "images/institutions/university-of-manchester.png"
    - institution: "Trinity College, Cambridge"
      association: "Student"
      coat: "images/institutions/trinity-college-cambridge.png"
    - institution: "University of Birmingham"
      association: "Professor of physics"
      coat: "images/institutions/university-of-birmingham.png"
  publications:
    - year: 1884
      title: "On the Transfer of Energy in the Electromagnetic Field"
      abstract: "Derived the energy-flux vector now bearing his name and described electromagnetic energy as flowing through the surrounding field."
    - year: 1903
      title: "Radiation in the Solar System: Its Effect on Temperature and Its Pressure on Small Bodies"
      abstract: "Analyzed radiation pressure and the orbital drag on small particles later called the Poynting–Robertson effect."

pieter_zeeman:
  name: "Pieter Zeeman"
  summary: "Discovered that a magnetic field splits spectral lines, directly connecting light with electromagnetism and atomic charge."
  color: "#f77f00"
  photo: "images/zeeman_pieter.jpg"
  cartoon: "images/cartoons/zeeman_pieter.png"
  nationality: "Dutch"
  birth: "1865-05-25"
  death: "1943-10-09"
  academic_affiliations:
    - institution: "Leiden University"
      association: "Student and doctorate"
      coat: "images/institutions/leiden-university.png"
    - institution: "University of Amsterdam"
      association: "Professor of physics"
      coat: "images/institutions/university-of-amsterdam.png"
  publications:
    - year: 1896
      title: "Over den invloed eener magnetisatie op den aard van het door een stof uitgezonden licht"
      abstract: "Reported the splitting and polarization of spectral lines when a light source was placed in a strong magnetic field."
    - year: 1913
      title: "Researches in Magneto-Optics"
      abstract: "Collected and extended experimental studies of how magnetic fields alter the emission and propagation of light."

etienne_malus:
  name: "Étienne-Louis Malus"
  summary: "Discovered polarization by reflection and established the intensity law for light passing through crossed polarizers."
  color: "#9c6644"
  photo: "images/malus_etienne.jpg"
  cartoon: "images/cartoons/malus_etienne.png"
  nationality: "French"
  birth: "1775-07-23"
  death: "1812-02-24"
  academic_affiliations:
    - institution: "École Polytechnique"
      association: "Engineering student"
      coat: "images/institutions/ecole-polytechnique.jpg"
  publications:
    - year: 1809
      title: "Sur une propriété de la lumière réfléchie"
      abstract: "Announced the discovery that ordinary reflection can polarize light and investigated the angular dependence of the effect."
    - year: 1810
      title: "Théorie de la double réfraction de la lumière dans les substances cristallisées"
      abstract: "Developed a mathematical theory of double refraction and polarization in crystals."

john_michell:
  name: "John Michell"
  summary: "Applied quantitative reasoning to magnetism, gravitation, earthquakes, and astronomy, and proposed stars massive enough to prevent light from escaping."
  color: "#386641"
  photo: "images/default.png"
  cartoon: "images/cartoons/default.png"
  nationality: "English"
  birth: "1724"
  death: "1793-04-21"
  academic_affiliations:
    - institution: "Queens' College, Cambridge"
      association: "Student, fellow and lecturer"
      coat: "images/institutions/queens-college-cambridge.png"
  publications:
    - year: 1750
      title: "A Treatise of Artificial Magnets"
      abstract: "Described methods for making strong artificial magnets and gave an early quantitative account of magnetic forces."
    - year: 1784
      title: "On the Means of Discovering the Distance, Magnitude, &c. of the Fixed Stars"
      abstract: "Proposed that sufficiently massive stars could prevent their own light from escaping and might be detected through the motions of companion stars."

carl_brans:
  name: "Carl H. Brans"
  summary: "Co-developed Brans–Dicke theory, an influential scalar–tensor alternative to Einstein's general theory of relativity."
  color: "#577590"
  photo: "images/brans_carl.jpg"
  cartoon: "images/cartoons/brans_carl.png"
  nationality: "American"
  birth: "1935-12-13"
  death: "2026-02-26"
  academic_affiliations:
    - institution: "Loyola University New Orleans"
      association: "Student and professor"
      coat: "images/institutions/loyola-university-new-orleans.png"
    - institution: "Princeton University"
      association: "Doctorate"
      coat: "images/institutions/princeton-university.png"
  publications:
    - year: 1961
      title: "Mach's Principle and a Relativistic Theory of Gravitation"
      abstract: "With Robert Dicke, formulated a scalar–tensor theory in which gravitational coupling varies with a dynamical field."
    - year: 1962
      title: "Mach's Principle and a Relativistic Theory of Gravitation. II"
      abstract: "Extended the scalar–tensor framework and examined further solutions and physical consequences of the theory."

lamoreaux:
  name: "Steve K. Lamoreaux"
  summary: "An American experimental physicist known for the first high-accuracy measurement of the Casimir force and for precision tests of fundamental physics."
  color: "#277da1"
  photo: "images/default.png"
  cartoon: "images/cartoons/default.png"
  nationality: "American"
  birth: ""
  death: ""
  academic_affiliations:
    - institution: "Stanford University"
      association: "Doctorate"
      coat: "images/institutions/stanford-university.png"
    - institution: "Yale University"
      association: "Professor of physics"
      coat: "images/institutions/yale-university.png"
  publications:
    - year: 1997
      title: "Demonstration of the Casimir Force in the 0.6 to 6 µm Range"
      abstract: "Reported the first high-accuracy measurement of the Casimir force over micrometre-scale separations."
    - year: 2011
      title: "Observation of the Thermal Casimir Force"
      abstract: "Measured the temperature-dependent contribution to the Casimir force in a precision experiment."

penzias:
  name: "Arno A. Penzias"
  summary: "A German-born American radio astronomer who, with Robert Woodrow Wilson, discovered the cosmic microwave background and shared the 1978 Nobel Prize in Physics."
  color: "#f3722c"
  photo: "images/penzias.jpg"
  cartoon: "images/cartoons/penzias.png"
  nationality: "American"
  birth: "1933-04-26"
  death: "2024-01-22"
  academic_affiliations:
    - institution: "City College of New York"
      association: "Student"
      coat: "images/institutions/city-college-of-new-york.png"
    - institution: "Columbia University"
      association: "Doctorate"
      coat: "images/institutions/columbia-university.png"
  publications:
    - year: 1965
      title: "A Measurement of Excess Antenna Temperature at 4080 Mc/s"
      abstract: "With Robert Woodrow Wilson, reported the persistent microwave noise recognized as the cosmic microwave background."
    - year: 1970
      title: "Carbon Monoxide in the Orion Nebula"
      abstract: "With Robert Woodrow Wilson and Keith B. Jefferts, reported the first detection of interstellar carbon monoxide."

wilson_robert:
  name: "Robert Woodrow Wilson"
  summary: "An American radio astronomer who, with Arno Penzias, discovered the cosmic microwave background and shared the 1978 Nobel Prize in Physics."
  color: "#90be6d"
  photo: "images/wilson_robert.jpg"
  cartoon: "images/cartoons/wilson_robert.png"
  nationality: "American"
  birth: "1936-01-10"
  death: ""
  academic_affiliations:
    - institution: "Rice University"
      association: "Student"
      coat: "images/institutions/rice-university.png"
    - institution: "California Institute of Technology"
      association: "Doctorate"
      coat: "images/institutions/california-institute-of-technology.png"
  publications:
    - year: 1965
      title: "A Measurement of Excess Antenna Temperature at 4080 Mc/s"
      abstract: "With Arno Penzias, reported the unexplained microwave signal recognized as relic radiation from the early universe."
    - year: 1970
      title: "Carbon Monoxide in the Orion Nebula"
      abstract: "With Keith B. Jefferts and Arno Penzias, reported the first detection of carbon monoxide in interstellar space."

wheeler:
  name: "John Archibald Wheeler"
  summary: "An American theoretical physicist who co-predicted photon-photon pair creation, developed the liquid-drop account of nuclear fission, and helped revive general relativity."
  color: "#4d908e"
  photo: "images/wheeler.jpg"
  cartoon: "images/cartoons/wheeler.png"
  nationality: "American"
  birth: "1911-07-09"
  death: "2008-04-13"
  academic_affiliations:
    - institution: "Johns Hopkins University"
      association: "Student and doctorate"
    - institution: "Princeton University"
      association: "Professor of physics"
      coat: "images/institutions/princeton-university.png"
    - institution: "University of Texas at Austin"
      association: "Director of the Center for Theoretical Physics"
  publications:
    - year: 1934
      title: "Collision of Two Light Quanta"
      abstract: "With Gregory Breit, calculated how the collision of two photons can produce an electron–positron pair."
    - year: 1939
      title: "The Mechanism of Nuclear Fission"
      abstract: "With Niels Bohr, used the liquid-drop model to explain the mechanism and energy dependence of nuclear fission."
    - year: 1955
      title: "Geons"
      abstract: "Introduced self-gravitating configurations made entirely of field energy and named them geons."

breit:
  name: "Gregory Breit"
  summary: "An American theoretical physicist who made foundational contributions to relativistic electron interactions, nuclear-resonance theory, and photon-photon pair creation."
  color: "#c77d32"
  photo: "images/breit.jpg"
  cartoon: "images/cartoons/breit.png"
  nationality: "American"
  birth: "1899-07-14"
  death: "1981-09-11"
  academic_affiliations:
    - institution: "Johns Hopkins University"
      association: "Student and doctorate"
    - institution: "New York University"
      association: "Professor of physics"
    - institution: "University of Wisconsin–Madison"
      association: "Professor of physics"
    - institution: "Yale University"
      association: "Professor of physics"
      coat: "images/institutions/yale-university.png"
  publications:
    - year: 1929
      title: "The Effect of Retardation on the Interaction of Two Electrons"
      abstract: "Derived a relativistic correction to the interaction of two electrons, leading to the two-particle equation now associated with Breit."
    - year: 1934
      title: "Collision of Two Light Quanta"
      abstract: "With John Archibald Wheeler, calculated electron–positron pair production from the collision of two photons."
    - year: 1936
      title: "Capture of Slow Neutrons"
      abstract: "With Eugene Wigner, developed the resonance description of slow-neutron capture now known through the Breit–Wigner formula."
