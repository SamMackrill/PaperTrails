      abstract: "Developed a practical spacetime method for calculating electron–photon interactions, laying the foundation for Feynman diagrams and renormalized quantum electrodynamics."
    - year: 1969
      title: "Very High-Energy Collisions of Hadrons"
      abstract: "Introduced the parton picture of high-energy hadron collisions, helping reveal the point-like constituents later identified with quarks and gluons."

kepler:
  name: "Johannes Kepler"
