      abstract: "Proposed a temperature scale independent of the properties of any particular substance and located absolute zero near −273 degrees Celsius."
    - year: 1851
      title: "On the Dynamical Theory of Heat"
      abstract: "Reconciled Carnot's heat-engine theory with Joule's mechanical equivalent of heat and stated a foundational form of the second law of thermodynamics."
    - year: 1852
      title: "On a Universal Tendency in Nature to the Dissipation of Mechanical Energy"
      abstract: "Described the irreversible degradation of mechanical energy into less useful forms, establishing energy dissipation as a universal tendency."

