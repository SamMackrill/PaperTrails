    - id: tycho_brahe-work-01
      legacyKey: publication:tycho_brahe:1
      year: 1588
      title: "De mundi aetherei recentioribus phaenomenis liber secundus"
      abstract: "Reported observations of the comet of 1577, argued that it travelled beyond the Moon, and presented Tycho's geoheliocentric planetary system."

