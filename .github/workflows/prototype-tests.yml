name: Timeline tests
on:
  pull_request:
    branches: ['main', 'prototype/ui-pass2', 'ui-pass2/**']
  push:
    branches: ['main', 'prototype/ui-pass2', 'ui-pass2/**']
permissions:
  contents: read
jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test tools/*.test.mjs
      - run: python3 -m unittest discover -s tools/prototype -p 'test_*.py'
      - name: Browser interactions and visual layout
        timeout-minutes: 5
        run: |
          export PAPERTRAILS_BROWSER="$(command -v google-chrome || command -v chromium)"
          node tools/prototype/browser-audit.mjs
